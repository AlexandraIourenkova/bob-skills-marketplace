# Release of one pack version: triggered by a tag <pack>--v<version> on a merged commit.
name: release

on:
  push:
    tags: ["*--v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        run: python3 -m pip install --quiet uv
      - name: Tag matches pack.json
        id: pack
        run: echo "dir=$(python3 scripts/check_release_tag.py '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"
      - name: Gate must be green on the tagged commit
        run: |
          uv run --project cli bob-skills registry validate
          uv run --project cli bob-skills lint "${{ steps.pack.outputs.dir }}"
      - name: Package the pack
        run: |
          tar -czf "${{ github.ref_name }}.tar.gz" -C "$(dirname '${{ steps.pack.outputs.dir }}')" "$(basename '${{ steps.pack.outputs.dir }}')"
          sha256sum "${{ github.ref_name }}.tar.gz" > "${{ github.ref_name }}.sha256"
      # Planned: cosign sign-blob with the vendor key from vendors.json (docs/security-gate.md).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: ${{ github.server_url }}
          TAG: ${{ github.ref_name }}
        run: |
          SPEC="${TAG%%--v*}@${TAG##*--v}"
          gh release create "${{ github.ref_name }}" "${{ github.ref_name }}.tar.gz" "${{ github.ref_name }}.sha256" \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" \
            --notes "Pack release. Install: uvx bob-skills add $SPEC" || echo "::warning::gh release failed; upload the archives by hand"
