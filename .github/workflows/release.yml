# Release of one pack version: triggered by a tag <pack>--v<version> on a merged commit.
name: release

on:
  push:
    tags: ["*--v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        run: python3 -m pip install --quiet uv
      - name: Tag matches pack.json
        id: pack
        run: echo "dir=$(python3 scripts/check_release_tag.py '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"
      - name: Gate must be green on the tagged commit
        run: |
          uv run --project cli bob-skills registry validate
          uv run --project cli bob-skills lint "${{ steps.pack.outputs.dir }}"
      - name: Package and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_pack.py "${{ github.ref_name }}"
