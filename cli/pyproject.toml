[project]
name = "bob-skills"
version = "0.1.0"
description = "Install, verify and guard skill packs for IBM Bob from the Bob Skills Marketplace"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Bob Skills Marketplace team" }]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.scripts]
bob-skills = "bob_skills.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bob_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
