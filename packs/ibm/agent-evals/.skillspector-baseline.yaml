version: 2
scanner_version: 2.11.2
rules:
- id: PE3
  path: '*references/auth.md'
  message: '*credentials.yaml*'
  reason: 'Reviewed 2026-09-29 by the pack authors: auth.md names ~/.cache/orchestrate/credentials.yaml
    only to say that the client never reads it. Credentials come from the WO_* environment
    variables, and no script in the pack opens a path under ~/.cache/orchestrate or
    ~/.config/orchestrate.'
- id: LP3
  path: '*SKILL.md'
  reason: 'Reviewed 2026-09-29 by the pack authors: LP3 is the missing allowed-tools
    field in SKILL.md frontmatter. Bob reads name and description only; the tool scope
    comes from the agent-evals mode (read, execute, skill, edits only under agent-evals/)
    and the agent-evals rule.'
- id: E1
  path: '*SKILL.md'
  message: '*api.us-south.watson-orchestrate.cloud.ibm.com*'
  reason: 'Reviewed 2026-09-29 by the pack authors: https://api.us-south.watson-orchestrate.cloud.ibm.com/instances/<id>
    is the documented example value of WO_INSTANCE (SKILL.md, api-routes.md, the wxo_client.py
    usage text). Requests go only to the instance the user sets in WO_INSTANCE and
    to IBM''s token hosts, inside networkAllow.'
- id: E1
  path: '*references/api-routes.md'
  message: '*api.us-south.watson-orchestrate.cloud.ibm.com*'
  reason: 'Reviewed 2026-09-29 by the pack authors: https://api.us-south.watson-orchestrate.cloud.ibm.com/instances/<id>
    is the documented example value of WO_INSTANCE (SKILL.md, api-routes.md, the wxo_client.py
    usage text). Requests go only to the instance the user sets in WO_INSTANCE and
    to IBM''s token hosts, inside networkAllow.'
- id: E1
  path: '*scripts/wxo_client.py'
  message: '*api.us-south.watson-orchestrate.cloud.ibm.com*'
  reason: 'Reviewed 2026-09-29 by the pack authors: https://api.us-south.watson-orchestrate.cloud.ibm.com/instances/<id>
    is the documented example value of WO_INSTANCE (SKILL.md, api-routes.md, the wxo_client.py
    usage text). Requests go only to the instance the user sets in WO_INSTANCE and
    to IBM''s token hosts, inside networkAllow.'
- id: PE3
  path: '*references/ibm-framework.md'
  message: '*credentials.yaml*'
  reason: 'Reviewed 2026-09-29 by the pack authors: ibm-framework.md names ~/.cache/orchestrate/credentials.yaml
    to warn the user that IBM''s own `orchestrate evaluations` rewrites it. No script
    in the pack reads or writes the file.'
- id: P3
  path: '*references/ibm-framework.md'
  message: '*send messages to*'
  reason: 'Reviewed 2026-09-29 by the pack authors: ''send messages to'' describes
    what IBM''s `orchestrate evaluations evaluate` and `generate` do to the agent
    under test, in a warning shown before the user runs them. It is not an instruction
    to transmit data anywhere.'
- id: E4
  path: '*SKILL.md'
  message: '*capture thread*'
  reason: 'Reviewed 2026-09-29 by the pack authors: ''capture thread'' is the option
    syntax `--capture thread|stream|stream-alt|v2` in the wxo-eval-run SKILL.md and
    the run_cases.py usage text. It picks how the runner reads the agent''s turn back
    from the user''s own tenant; nothing goes to another service.'
- id: E4
  path: '*scripts/run_cases.py'
  message: '*capture thread*'
  reason: 'Reviewed 2026-09-29 by the pack authors: ''capture thread'' is the option
    syntax `--capture thread|stream|stream-alt|v2` in the wxo-eval-run SKILL.md and
    the run_cases.py usage text. It picks how the runner reads the agent''s turn back
    from the user''s own tenant; nothing goes to another service.'
