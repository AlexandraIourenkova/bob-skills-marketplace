version: 2
scanner_version: 2.11.2
rules:
- id: AE1
  reason: 'Reviewed 2026-09-10: RP1 flags the marketplace''s own imperative rules
    (never install without confirmation, refuse unknown repositories); enforcing them
    is the skill''s purpose. Reviewed 2026-09-11: AS2 in bob-doctor, which reads the
    user''s MCP configuration by design to find secrets and risky entries; the doctor
    command reports keys, never values, and the skill replaces a secret with an environment
    reference without printing it. RA2 matches mentions of Bob rules, modes and commands
    that the user installs or asks to create; nothing persists without the user''s
    request. AE1: SkillSpector inspects only part of references/catalog.md, the offline
    catalog that index.json and marketplace.json written generates from index.json;
    the policy linter reads that file in full on every gate run.'
  path: '*SKILL.md'
