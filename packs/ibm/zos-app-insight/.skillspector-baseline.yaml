  reason: "The scanner inspected the referenced script only partly because of its size. The scripts were read by the marketplace team: they use the standard library only, write only under zos-insight/ through one output guard, open no network connection, and the only process they start is Zowe CLI from zowe_fetch.py with an allow-listed argument list and no shell. Reviewed 2026-10-21."
