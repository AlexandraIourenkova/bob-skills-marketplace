version: 2
scanner_version: 2.11.2
rules:
- id: LP3
  reason: "No per-skill licence field in the frontmatter; the pack ships the upstream Apache-2.0 LICENSE next to the skills. Reviewed 2026-10-21."
  path: '*SKILL.md'
- id: PE3
  reason: "Comparison table that names kubeconfig as where Argo CD keeps cluster credentials; documentation, no credential access. Reviewed 2026-10-21."
  path: '*references/agent-mode.md'
- id: PE3
  reason: "Same Argo CD comparison table naming kubeconfig; documentation, no credential access. Reviewed 2026-10-21."
  path: '*references/applications.md'
- id: PE3
  reason: "Recommends encrypting secrets.yaml with SOPS or using sealed secrets; the opposite of a credential leak. Reviewed 2026-10-21."
  path: '*references/best-practices.md'
- id: PE3
  reason: "Table of the Secret key names GitOps Promoter expects for each SCM provider; no values. Reviewed 2026-10-21."
  path: '*references/gitops-promoter.md'
- id: E1
  reason: "Placeholder webhook URL api.example.com in an Argo Events example. Reviewed 2026-10-21."
  path: '*references/events.md'
- id: E1
  reason: "Placeholder webhook URL api.example.com in an Argo CD notifications example. Reviewed 2026-10-21."
  path: '*references/notifications.md'
- id: E1
  reason: "Placeholder webhook URL api.example.com in an Argo Rollouts example. Reviewed 2026-10-21."
  path: '*references/rollouts.md'
- id: E1
  reason: "Placeholder webhook URL api.example.com in an Argo Workflows example. Reviewed 2026-10-21."
  path: '*references/workflows.md'
- id: SC2
  reason: "In-cluster connectivity test (kubectl run curl-test, then curl a Service). It creates a pod, so the pack rule requires the user's yes for `kubectl run` like any other change. Reviewed 2026-10-21."
  path: '*references/troubleshooting.md'
- id: TM1
  reason: "Argo CD CRD JSON schema: skipTests and similar are schema field names used by kubeconform validation, not commands. Reviewed 2026-10-21."
  path: '*assets/schemas/application-argoproj-v1alpha1.json'
- id: EA2
  reason: "Checklist item about when automated sync is appropriate; not an instruction to deploy without confirmation. Reviewed 2026-10-21."
  path: '*references/best-practices.md'
- id: PE3
  reason: "Real: the backup procedure exports repo and cluster Secrets to local files and calls them encrypted, though they are base64. The pack rule says these backups are not encryption and asks before writing one to disk; the pack safety entry repeats it. Reviewed 2026-10-21."
  path: '*references/day2-operations.md'
- id: PE3
  reason: "Applies a cluster Secret manifest after a server-side dry run and the user's confirmation, as the skill's own safety model requires. Reviewed 2026-10-21."
  path: '*references/setup.md'
- id: EA2
  reason: "argo-operations marks Secret and ConfigMap export as read-only with no confirmation; argo-team-onboard marks its cluster checks as read-only. The pack rule asks before any backup with Secrets is written to disk. Reviewed 2026-10-21."
  path: '*SKILL.md'
- id: PE1
  reason: "Guard-rail table explaining which AppProject fields stop teams from escalating their own permissions; documentation of a defence. Reviewed 2026-10-21."
  path: '*references/self-service-pattern.md'
